  "compare": "<h2>Perbezaan Pakej — Standard 5D4N vs Premium 6D5N</h2><p class='ssub'>✔ = termasuk · <strong>Add-on</strong> = upsell (beli berasingan) · — = tidak termasuk. Item yang <strong>Add-on</strong> pada Standard sudah <strong>included</strong> dalam Premium.</p><table class='cmp'><colgroup><col class='c1'><col><col></colgroup><thead><tr><th class='blank'></th><th>STANDARD 5D4N</th><th>PREMIUM 6D5N</th></tr></thead><tbody><tr><td class='feat'>Durasi</td><td class='val'>5 Hari 4 Malam</td><td class='val'>6 Hari 5 Malam</td></tr><tr><td class='feat'>Hotel</td><td class='val'>3★ Apartment (bukan CBD)</td><td class='val'>4★ Hotel CBD (Mercure On Hay)</td></tr><tr><td class='feat'>Return Private Airport Transfer</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Driver cum Guide</td><td class='val'>Hari tour sahaja</td><td class='val'>Sepanjang trip</td></tr><tr><td class='feat'>Breakfast</td><td class='val'><span class='no'>—</span> (masak sendiri)</td><td class='val'><span class='tick'>✔</span> 4× (halal-friendly)</td></tr><tr><td class='feat'>Lunch halal</td><td class='val'><span class='tick'>✔</span> 2×</td><td class='val'><span class='tick'>✔</span> 3×</td></tr><tr><td class='feat'>Dinner</td><td class='val'><span class='no'>—</span></td><td class='val'><span class='no'>—</span></td></tr><tr><td class='feat'>Caversham Wildlife Park</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Swan Valley + Chocolate Factory</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Fremantle Day Tour</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Mandurah Dolphin & Canal Cruise</td><td class='val'>Add-on <small>(RM 180)</small></td><td class='val'><span class='tick'>✔</span></t j</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Peak Season (semua tarikh peak)</td><td class='add'>+10% per pax</td><td>Tarikh: 19–28 Mac · 1–20 Apr · 1–15 Jul · 19–31 Ogos · 1 Sep–31 Dis 2026 · 15 Jan–20 Feb 2027 · 1–15 Mac 2026</td></tr><tr><td class='it'>Travel Date 2027 add-on</td><td class='add'>+RM 100 / pax</td><td>Untuk travel 1 Jan–30 Jun 2027 — tambah <em>atas</em> harga & peak</td></tr><tr><td class='it'>Late Booking</td><td class='add'>RM 50 / booking</td><td>Booking &lt;45 hari sebelum departure; 2 pax &amp; ke atas +RM 50/pax (by request)</td></tr></tbody></table><p class='custnote'>⚠ Rate card 2026/2027 ringkaskan peak Perth kepada <strong>+10%/pax</strong> + add-on <strong>RM 100/pax</strong> (travel 2027). Katalog PT Perth pula guna peak berperingkat (Autumn/Winter RM 80–250/pax/malam, Spring/Summer +5%, Christmas/NY +10%). Sahkan dengan PO mana satu terpakai sebelum quote.</p></div>",

 "snapshot": "# PT Perth — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*2 varian: **Standard 5D4N** (apartment 3★, 2 tour + 1 F&E) & **Premium 6D5N** (hotel 4★ CBD, Pinnacles + Mandurah Cruise included). Valid until 31 Mac 2027.*\n\n- **Deposit** RM 1,000/pax untuk confirm booking. **Full payment** 45 hari sebelum arrival.\n- Harga sah **24 jam** selepas quotation submission; quotation, itinerari & harga subject to change.\n- Harga untuk **2–3 orang sebilik**. Single occupancy: +RM 1,500 (STD) / +RM 2,500 (PREM).\n- **Late booking** &lt;45 hari: +RM 50/booking. Peak season surcaj ikut musim & hotel tier (lihat tab Surcaj).\n- **Final itinerari** dikonfirmasi 14 hari sebelum trip; lokasi apartment/hotel 15 hari sebelum departure.\n- **Airport transfer** termasuk 06:00–22:00. Tiba/pulang 10:01 malam–5:59 pagi kena surcaj AUD 50/jam (bayar tunai). Check-in hotel biasanya ~12 tengah hari — jika perlu early check-in, tambah 1 malam.\n- **Extra hour transport** AUD 50/jam bayar TUNAI kepada driver.\n- **Pinnacles & Lancelin (PREM Day 5):** permukaan tidak rata & berhabuk, perjalanan ~2 jam sehala — kurang sesuai warga emas / anak kecil.\n- **Passport** sah minimum 6 bulan. Immigration Australia ketat.\n- Umur dikira ikut **tarikh travel**: Adult 12+, Child w/Bed 5–11, Child no Bed 2–4, Infant &lt;2 (FOC).\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Apa beza Standard 5D4N dengan Premium 6D5N?**\nStandard: apartment 3★ (bukan CBD, kitchenette), 2 hari tour (Swan Valley + Fremantle) + 1 hari Free & Easy, 2x lunch halal, Caversham included. Premium: hotel 4★ CBD dengan breakfast, driver-cum-guide sepanjang trip, tambah Mandurah Dolphin Cruise + Pinnacles Desert + Lancelin Sand Dunes, 4x breakfast + 3x lunch halal.\n\n**Pakej ni rushing tak?**\nTidak rushing. Standard ada 1 hari Free & Easy (Day 3). Premium ada half-day F&E (Day 2 petang). Tour 6–10 jam sehari dengan stop rehat untuk solat. Nota: Pinnacles Day (PREM Day 5) 10 jam, agak panjang untuk warga emas.\n\n**Pakej ni ada tourist trap / compulsory shopping tak?**\nTiada. ARBA tidak include mana-mana compulsory shopping atau tourist trap. Semua tempat dalam itinerari adalah genuine sightseeing/experience.\n\n**Boleh bawa personal stop / request sendiri?**\nBoleh untuk private tour. Bincang dengan Travel Consultant sebelum trip atau on-the-spot dengan driver.\n\n**Sesuai ke untuk family & kanak-kanak?**\nSangat sesuai. Caversham Wildlife Park (kangaroo feeding, koala) family-favourite, Mandurah Cruise child-friendly, Kings Park ada playground. Elak Pinnacles/Lancelin untuk toddler.\n\n**Sesuai untuk warga emas / yang tak boleh jalan jauh?**\nSesuai, cuma elak Pinnacles (long drive + permukaan tidak rata). Kings Park (PREM) ada laluan wheelchair. Maklumkan Travel Consultant awal untuk kenderaan sesuai.\n\n### B. Halal, Makanan & Solat\n\n**Makanan halal senang dapat di Perth?**\nYa. Perth ada ramai penduduk Muslim (~50,000+) & banyak restoran halal bersijil — Melayu, Indonesia, Indian Muslim, Middle Eastern, Halal Chinese. Kebanyakan buka ~10 pagi ke atas.\n\n**Kita akan makan apa dalam pakej?**\nStandard (2x lunch): Day 2 Charcoal Chicken (halal), Day 4 Kailis Fish & Chips Fremantle (halal-friendly). Premium (4x breakfast + 3x lunch): breakfast hotel halal-friendly + Charcoal Chicken, Kailis, dan Fish & Chips Pinnacles. Dinner semua hari TIDAK termasuk — explore restoran halal Perth.\n\n**Breakfast macam mana?**\nStandard: masak sendiri di apartment (kitchenette — telur, mi segera, cereal) atau restoran halal (~buka 10 pagi). Premium: breakfast buffet hotel halal-friendly (roti, cereal, pastri, vegetarian, buah, jus).\n\n**Ada masjid/surau untuk solat?**\nYa. Solat time-blocked di masjid pada Day 2 & Day 4 (Standard), dan surau Watertown pada Premium Day 4. Ada Masjid Perth (William St, Northbridge) & masjid di Fremantle. Untuk tempat outdoor (Pinnacles, Cottesloe, Rottnest) — bawa sejadah & solat di rest stop.\n\n### C. Visa & Passport\n\n**Perlu visa ke Australia?**\nYa — ETA Australia (Subclass 601), dimohon online/app rasmi (~AUD 20). Multiple entry setahun, tinggal hingga 3 bulan setiap lawatan. ARBA cadang mohon 90 hari (3 bulan) sebelum trip. Biasanya diluluskan dalam beberapa hari–2 minggu.\n\n**ARBA bantu proses visa?**\nYa, ARBA boleh bantu proses ETA untuk Warganegara Malaysia (service fee mungkin apply). Non-Malaysian perlu arrange visa sendiri.\n\n**Passport perlu sah berapa lama?**\nMinimum 6 bulan dari tarikh berlepas. Immigration Australia ketat.\n\n### D. Flight & Airport\n\n**Kita naik flight apa?**\nFlight tidak termasuk (customer self-arrange, ARBA boleh bantu book). Pilihan direct KUL–PER: Malaysia Airlines (premium, ~5j 35min, bagasi 25–30kg, in-flight meal), AirAsia X (kos efektif, bagasi 20kg add-on), Batik Air. ~4 penerbangan direct sehari.\n\n**Berapa lama flight & ada transit tak?**\nDirect, tiada transit. Masa penerbangan ~5 jam 35 minit KUL–PER.\n\n**Berapa kg bagasi?**\nPremium airlines: 25–30kg (MH Economy 25kg). AirAsia X: 20kg add-on. Semak dengan airline.\n\n**Boleh combine dengan flight domestik Australia (Sydney/Melbourne)?**\nBoleh — bincang Travel Consultant untuk domestic flight + connecting itinerary. Semak validity trip sebelum book connecting flight.\n\n### E. Hotel & Bilik\n\n**Hotel apa digunakan?**\nStandard: Apartment 3★ (Comfort Inn & Suites / Good Health) — bukan CBD, kitchenette, 1 bilik air/unit. Premium: Hotel 4★ (Mercure On Hay / Mercure Perth / Ibis Perth) di CBD dengan breakfast halal-friendly. Upgrade tersedia (3★ Hotel CBD, 4★, atau 5★ Duxton).\n\n**Bilik macam mana?**\n2 pax twin · 3 pax triple · 4 pax quad · 5 pax quint · 6 pax 2× triple. Apartment Quad/Quint kongsi 1 tandas — jika tak selesa, tukar double/triple. Single occupancy tambah single supplement.\n\n**Boleh book multiple hotels untuk pengalaman berbeza?**\nBoleh, tapi ARBA cadang satu hotel untuk minimize check-in/out & pergerakan luggage. Multi-hotel via Travel Consultant (extra cost mungkin apply).\n\n### F. Cuaca & Musim\n\n**Musim & cuaca Perth macam mana? Bila terbaik?**\n4 musim: Summer (Dis–Feb) 18–32°C kadang >40°C; Autumn (Mac–Mei) 13–26°C; Winter (Jun–Ogos) 8–19°C, lebih hujan; Spring (Sep–Nov) 11–25°C, paling mild + Tulip Festival. Terbaik: Spring untuk tulip & cuaca sederhana; Summer untuk beach & fruit picking.\n\n**Mesti nampak salji ke kalau pergi musim sejuk?**\nTiada salji di bandar Perth. Winter sejuk tapi tak salji. Untuk salji perlu custom ke Ski Resort (Bluff Knoll / Stirling Range) — extra cost & hari.\n\n### G. Shopping & Duit\n\n**Beli apa & di mana?**\nWatertown Factory Outlets & DFO — Adidas, Nike, Cotton On, Levi's, Tommy Hilfiger, Coach Factory. Fremantle Market untuk produk segar & souvenir. Shopping ~1.5–3 jam.\n\n**Cadangan cash & cara bayar?**\nBawa cash RM 1,500–3,000/pax untuk personal expenses, add-on & souvenir. Kedai kecil/market: cash AUD. Shopping centre/hotel/restoran: kad (Visa/MC) & mobile pay (Apple/Google Pay) diterima meluas. ATM tersedia.\n\n### H. Payment & Refund\n\n**Deposit & full payment berapa?**\nDeposit RM 1,000/pax untuk confirm. Full payment 45 hari sebelum arrival. Late booking (&lt;45 hari): +RM 50/booking.\n\n**Harga sah berapa lama?**\n24 jam selepas quotation. Quotation, itinerari & harga subject to change accordingly.\n\n### I. Add-ons & Customization\n\n**Apa add-on popular?**\nMandurah Dolphin Cruise (RM 180/adult — included dalam PREM), Pinnacles Day Tour (RM 3,800/transport untuk STD), Araluen Tulip Park (RM 85, seasonal Ogos–Okt), Rottnest Ferry (RM 350), Sand Board Lancelin (RM 80), Fruit Picking (RM 80, seasonal), Pocket Wifi (RM 150) / eSIM (RM 95), extra night, extra meal, takaful.\n\n**Boleh extend stay?**\nBoleh. Extra night 4★ Mercure RM 350/pax/malam, 3★ Apartment RM 200/pax/malam. Bincang Travel Consultant.\n\n### J. Kesihatan & Keselamatan\n\n**Pinnacles Desert berbahaya untuk warga emas / kanak-kanak?**\nPinnacles & Lancelin Sand Dunes kurang sesuai warga emas/anak kecil sebab permukaan longgar & tidak rata (risiko tergelincir/terseliuh). Walking ~30–45 minit. Bawa kasut sukan/hiking, topi, sunblock.\n\n**Ada precaution kesihatan?**\nPerth bukan altitud tinggi — tiada altitude sickness. Summer boleh >40°C (hydrate); Winter sejuk (bawa jaket). UV Australia kuat — sunblock SPF30+.\n\n### K. Praktikal (SIM, Socket, Internet)\n\n**Adapter plug & voltan?**\nAustralia guna Type I (3-pin bersudut), 230V/50Hz. Bawa universal travel adapter (perlu untuk laptop/hairdryer walaupun ada USB port di hotel).\n\n**Internet macam mana? Boleh roaming?**\nPilihan: Pocket Wifi RoamingMan (RM 150/trip, 3GB, kongsi 5 device), eSIM Australia (RM 95/7 hari, 5GB), roaming telco MY (paling mahal), atau Wifi hotel percuma. Tiada sekatan VPN — Google, FB, IG, YouTube, WhatsApp semua berfungsi.\n\n**Ada service dobi/laundry?**\nLaundry tidak termasuk pakej. Apartment Standard ada washing machine (free). Ada laundromat di CBD. Laundry hotel mahal (~AUD 5–10/item).\n\n### L. Packing\n\n**Apa patut bawa?**\nKasut selesa untuk berjalan (kasut hiking untuk Pinnacles/Lancelin), jaket (angin kuat di pantai & winter sejuk), topi & sunblock SPF30+, sejadah/telekung untuk solat outdoor, universal adapter, dan cash AUD untuk market. Pakaian sopan untuk pantai.\n"

/* --- markdown engine --- */
function renderBody(lines){let html="",i=0;while(i<lines.length){let ln=lines[i];
  if(/^\s*\|.*\|\s*$/.test(ln)){const t=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t.push(lines[i]);i++;}html+=renderTable(t);continue;}
  if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
  if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}return html;}
function renderTable(rows){rows=rows.filter(r=>!/^\s*\|[\s\-|:]+\|\s*$/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(!rows.length)return"";
  let h="<table class='kb'><thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=1;r<rows.length;r++)h+="<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";return h+"</tbody></table>";}
function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;
  while(i<lines.length){const ln=lines[i];
    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}
    if(cur){
      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

/* topics: fixed order. blocks (pricing/custom/surcharge/transport/stay) come from KB.blocks */
const TOPICS=[
 {id:"compare",t:"Perbezaan Pakej"},{id:"itin",t:"Itinerary & Aktiviti"},{id:"pricing",t:"Harga & Pakej"},{id:"custom",t:"Simple Customisation"},
 {id:"surcharge",t:"Surcharge"},{id:"transport",t:"Transportation & Guide"},{id:"stay",t:"Accommodation"},
 {id:"food",t:"Halal & Makanan"},{id:"flight",t:"Flight & Airport"},{id:"prayer",t:"Solat"},
 {id:"weather",t:"Cuaca & Musim"},{id:"tips",t:"Shopping & Tips"},{id:"visa",t:"Visa & Passport"},
 {id:"freegift",t:"Free Gift (Promo)"},{id:"polisi",t:"Polisi & Payment"},
];
const CATMAP={a:"itin",i:"custom",e:"stay",d:"flight",f:"weather",g:"tips",j:"tips",k:"tips",l:"tips",c:"visa",h:"polisi"};
const PRAYER_RE=/solat|masjid|surau|qiblat|subuh|sembahyang|telekung|sejadah/i;
function topicOf(letter,q,body){letter=(letter||"").toLowerCase();
  if(letter==="b")return PRAYER_RE.test((q||"")+" "+(body||[]).join(" "))?"prayer":"food";
  return CATMAP[letter]||"itin";}
function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  [["compare",B.compare],["pricing",B.pricing],["custom",B.custom],["surcharge",B.surcharge],["transport",B.transport],["stay",B.stay],["freegift",B.freegift]].forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){existing.insertAdjacentHTML("beforeend",b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,""));}
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');if(_stay)_stay.insertAdjacentHTML("beforeend",renderHotels());
  var _itin=document.querySelector('.block[data-topic="itin"]');if(_itin){var _h2=_itin.querySelector("h2");if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+renderActs());}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=d.dataset.text.includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});
build(KB.snapshot);
</script>
